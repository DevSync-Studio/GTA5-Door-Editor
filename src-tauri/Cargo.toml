[package]
name = "gta5-door-editor"
# Keep in sync with package.json and tauri.conf.json
version = "0.1.0"
description = "FiveM door tuning, type, audio, merge, and nametable editor"
authors = ["DevSync Studio"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
texture2ddecoder = "0.1.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
